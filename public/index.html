<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>公司內部任務管理</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>公司內部任務管理</h1>
</header>

<div class="container">
  <div class="tabs">
    <button class="tab-btn active" data-tab="list">任務列表</button>
    <button class="tab-btn" data-tab="search">查詢歷史</button>
    <button class="tab-btn" data-tab="manage">管理作業</button>
  </div>

  <!-- 任務列表 -->
  <div id="tab-list" class="tab-content active">
    <div class="toolbar">
      <button class="btn btn-primary" id="btn-add">+ 新增任務</button>
      <div class="filter-row">
        <label>負責人：</label>
        <select id="filter-assignedTo"><option value="">全部</option></select>
        <label>狀態：</label>
        <select id="filter-status">
          <option value="">全部</option>
          <option value="進行中" selected>進行中</option>
          <option value="已完成">已完成</option>
        </select>
        <label>優先序：</label>
        <select id="filter-priority">
          <option value="">全部</option>
          <option value="高">高</option>
          <option value="中">中</option>
          <option value="低">低</option>
        </select>
        <label>類型：</label>
        <select id="filter-type">
          <option value="">全部</option>
        </select>
        <button class="btn btn-secondary" id="btn-filter">套用</button>
      </div>
    </div>

    <div class="sort-bar">
      <span class="sort-label">排序：</span>
      <button class="sort-btn active" data-sort="assignedDate">新增時間</button>
      <button class="sort-btn" data-sort="assignedTo">負責人</button>
      <button class="sort-btn" data-sort="status">辦理狀態</button>
      <button class="sort-btn" data-sort="startDate">預計開始</button>
      <button class="sort-btn" data-sort="dueDate">預計完成</button>
    </div>

    <div id="todo-list"></div>
  </div>

  <!-- 查詢歷史 -->
  <div id="tab-search" class="tab-content">
    <div class="search-form">
      <div class="search-grid">
        <div class="form-row">
          <label>任務名稱</label>
          <input type="text" id="s-task" placeholder="模糊搜尋">
        </div>
        <div class="form-row">
          <label>負責人</label>
          <input type="text" id="s-assignedTo" list="search-users-datalist" placeholder="負責人">
          <datalist id="search-users-datalist"></datalist>
        </div>
        <div class="form-row">
          <label>辦理狀態</label>
          <select id="s-status">
            <option value="">全部</option>
            <option value="進行中">進行中</option>
            <option value="已完成">已完成</option>
          </select>
        </div>
        <div class="form-row full-row">
          <label>新增時間</label>
          <div class="date-range">
            <input type="date" id="s-assignedDateFrom">
            <span>至</span>
            <input type="date" id="s-assignedDateTo">
          </div>
        </div>
        <div class="form-row full-row">
          <label>預計開始</label>
          <div class="date-range">
            <input type="date" id="s-startDateFrom">
            <span>至</span>
            <input type="date" id="s-startDateTo">
          </div>
        </div>
        <div class="form-row full-row">
          <label>預計完成</label>
          <div class="date-range">
            <input type="date" id="s-dueDateFrom">
            <span>至</span>
            <input type="date" id="s-dueDateTo">
          </div>
        </div>
      </div>
      <div class="search-actions">
        <button class="btn btn-primary" id="btn-search">查詢</button>
        <button class="btn btn-secondary" id="btn-search-clear">清除條件</button>
      </div>
    </div>
    <div id="search-results"></div>
  </div>

  <!-- 管理作業 -->
  <div id="tab-manage" class="tab-content">
    <div class="manage-section">
      <div class="manage-section-header">
        <h3>負責人管理</h3>
        <p class="manage-desc">維護可指派的人員清單，新增任務時可從清單選擇負責人。</p>
      </div>
      <div id="user-list-main" class="user-list-main"></div>
      <div class="add-user-row">
        <input type="text" id="new-user-name" placeholder="輸入姓名後按新增" maxlength="30">
        <button class="btn btn-primary" id="btn-add-user">新增</button>
      </div>
    </div>

    <div class="manage-section" style="margin-top:20px">
      <div class="manage-section-header">
        <h3>項目類型管理</h3>
        <p class="manage-desc">維護可選擇的項目類型清單，新增任務時可從清單選擇。</p>
      </div>
      <div id="type-list-main" class="user-list-main"></div>
      <div class="add-user-row">
        <input type="text" id="new-type-name" placeholder="輸入類型名稱後按新增" maxlength="20">
        <button class="btn btn-primary" id="btn-add-type">新增</button>
      </div>
    </div>
  </div>
</div>

<!-- 新增/編輯任務 Modal -->
<div id="modal" class="modal hidden">
  <div class="modal-backdrop" id="modal-backdrop"></div>
  <div class="modal-content">
    <h2 id="modal-title">新增任務</h2>
    <div id="f-parent-info" class="parent-info hidden"></div>
    <form id="todo-form" novalidate>
      <input type="hidden" id="f-id">
      <input type="hidden" id="f-parentId">

      <div class="form-group">
        <label for="f-task">任務項目 <span class="required">*</span></label>
        <input type="text" id="f-task" placeholder="請輸入任務名稱" required>
      </div>

      <div class="form-group">
        <label for="f-assignedTo">負責人</label>
        <input type="text" id="f-assignedTo" list="users-datalist" placeholder="選擇或輸入負責人">
        <datalist id="users-datalist"></datalist>
      </div>

      <div class="form-row-2col">
        <div class="form-group">
          <label for="f-assignedDate">新增時間</label>
          <input type="date" id="f-assignedDate">
          <input type="hidden" id="f-assignedTime">
        </div>
        <div class="form-group">
          <label for="f-status">辦理狀態</label>
          <select id="f-status">
            <option value="進行中">進行中</option>
            <option value="已完成">已完成</option>
          </select>
        </div>
      </div>

      <div class="form-row-2col" id="f-priority-type-row">
        <div class="form-group">
          <label for="f-priority">優先序</label>
          <select id="f-priority">
            <option value="高">高</option>
            <option value="中">中</option>
            <option value="低">低</option>
          </select>
        </div>
        <div class="form-group">
          <label for="f-type">項目類型</label>
          <select id="f-type"></select>
        </div>
      </div>

      <div class="form-row-2col">
        <div class="form-group">
          <label for="f-startDate">預計開始日期</label>
          <input type="date" id="f-startDate">
        </div>
        <div class="form-group">
          <label for="f-dueDate">預計完成日期</label>
          <input type="date" id="f-dueDate">
        </div>
      </div>

      <div class="form-group">
        <label for="f-description">任務說明</label>
        <textarea id="f-description" rows="3" placeholder="說明工作內容（選填）"></textarea>
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-secondary" id="btn-cancel">取消</button>
        <button type="submit" class="btn btn-primary">儲存</button>
      </div>
    </form>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
